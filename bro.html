<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما الوحش فهد</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        /* إضاءة خضراء قوية في الخلفية */
        .glow-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,255,0,0.15) 0%, rgba(0,0,0,1) 80%);
            z-index: -1;
            animation: pulse 3s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        /* خطوط الهكرز المتحركة */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0));
            background-size: 100% 4px, 3px 100%;
            z-index: 1;
            pointer-events: none;
        }

        h1 {
            color: #00ff41; /* لون مصفوفة الماتركس */
            font-size: 90px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ff41, 0 0 30px #00ff41, 0 0 60px #00ff41;
            margin-bottom: 50px;
            z-index: 2;
            animation: flicker 1.5s infinite;
        }

        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* زر الدخول الخرافي */
        .btn {
            position: relative;
            padding: 30px 80px;
            font-size: 45px;
            color: #00ff41;
            text-decoration: none;
            background: rgba(0, 255, 65, 0.1);
            border: 4px solid #00ff41;
            border-radius: 15px;
            font-weight: bold;
            transition: 0.4s;
            box-shadow: 0 0 20px #00ff41;
            z-index: 2;
        }

        .btn:hover {
            background: #00ff41;
            color: #000;
            box-shadow: 0 0 80px #00ff41;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="scanlines"></div>
    
    <h1>نورت يا وحش! 🟢</h1>
    
    <a href="https://cinemana.shabakaty.com/home" class="btn">دخول سينمانا</a>

</body>
</html>
