<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما الوحش فهد</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* خلفية الإضاءة المتحركة */
        .background-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,255,127,0.1) 0%, rgba(0,0,0,1) 70%);
            animation: pulseBg 4s infinite alternate;
            z-index: -1;
        }

        @keyframes pulseBg {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        /* نص الترحيب المتحرك */
        h1 {
            color: #00ff7f;
            font-size: 80px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #00ff7f, 0 0 20px #00ff7f, 0 0 40px #00ff7f, 0 0 80px #00ff7f;
            animation: flicker 2s infinite;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { text-shadow: 0 0 10px #00ff7f, 0 0 20px #00ff7f, 0 0 40px #00ff7f; }
            20%, 24%, 55% { text-shadow: none; }
        }

        /* الزر الخرافي */
        .btn {
            position: relative;
            padding: 25px 60px;
            font-size: 35px;
            color: #00ff7f;
            text-decoration: none;
            background: transparent;
            border: 3px solid #00ff7f;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.5s;
            overflow: hidden;
            box-shadow: 0 0 15px #00ff7f;
        }

        .btn:hover {
            background: #00ff7f;
            color: #000;
            box-shadow: 0 0 50px #00ff7f;
            transform: scale(1.1);
        }

        /* تأثيرات الخطوط اللي تمشي */
        .lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(0deg, transparent 0%, rgba(0, 255, 127, 0.2) 50%, transparent 100%);
            background-size: 100% 4px;
            animation: moveLines 2s linear infinite;
        }

        @keyframes moveLines {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }

    </style>
</head>
<body>
    <div class="background-glow"></div>
    <div class="lines"></div>
    
    <h1> ( نورت ا( الموقع من صنع فهد! 🍿</h1>
    
    <a href="https://cinemana.shabakaty.com/home" class="btn">دخول سينمانا</a>

    <script>
        // إضافة تأثير بسيط عند التحميل
        console.log("Welcome Fahad - RTX 4060 Mode Activated");
    </script>
</body>
</html>
